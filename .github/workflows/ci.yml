name: ci
on:
  push:
    branches: [main]
    paths: ["source/**"]
  pull_request:
    paths: ["source/**"]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/edulearn-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r source/app/requirements.txt flake8
      - run: flake8 source/app --max-line-length=120
      - run: pytest source/app/tests -q

  build-scan-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: source/app
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Trivy scan (gagal jika ada HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@57a97cXpY2GAXeKJwxSqF87BbPzD68Woy5trj8iKS1PPM # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - run: docker push ${{ env.IMAGE }}:${{ github.sha }}
      - name: Update image tag di manifest (GitOps)
        run: |
          cd 04-platform-kubernetes/manifests
          kustomize edit set image ghcr.io/OWNER/edulearn-api=${{ env.IMAGE }}:${{ github.sha }}
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "ci: deploy ${{ github.sha }}" || echo "no changes"
          git push
