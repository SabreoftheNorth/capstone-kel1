apiVersion: apps/v1
kind: Deployment
metadata:
  name: edulearn-api
  namespace: edulearn
  labels:
    app: edulearn-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app: edulearn-api
  template:
    metadata:
      labels:
        app: edulearn-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/OWNER/edulearn-api:latest   # tag diganti otomatis oleh CI via kustomize
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
          envFrom:
            - secretRef: {name: edulearn-db}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: edulearn-api
  namespace: edulearn
  labels:
    app: edulearn-api
spec:
  selector:
    app: edulearn-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edulearn-api
  namespace: edulearn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edulearn-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edulearn-api
  namespace: edulearn
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: edulearn-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edulearn-api
  namespace: edulearn
spec:
  ingressClassName: nginx
  rules:
    - host: edulearn.localtest.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edulearn-api
                port: {name: http}
